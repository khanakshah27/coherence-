version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: coherence-postgres
    environment:
      POSTGRES_USER: coherence
      POSTGRES_PASSWORD: coherence
      POSTGRES_DB: coherence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coherence"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coherence-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: coherence-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coherence-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coherence-backend
    environment:
      DATABASE_URL: postgresql://coherence:coherence@postgres:5432/coherence
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      PORT: 8080
      LOG_LEVEL: debug
      AWS_REGION: us-east-1
      AWS_PROFILE: default
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./backend:/app
    networks:
      - coherence-network

  # Frontend
  frontend:
    image: node:18-alpine
    container_name: coherence-frontend
    working_dir: /app
    environment:
      REACT_APP_API_URL: http://localhost:8080/api/v1
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm start"
    networks:
      - coherence-network

  # Prometheus (optional, for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: coherence-prometheus
    volumes:
      - ./deployments/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - coherence-network

  # Grafana (optional, for dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: coherence-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - coherence-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  coherence-network:
    driver: bridge
