global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'coherence'

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'coherence-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: /api/v1/metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
