name: Coherence CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Backend ────────────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: coherence
          POSTGRES_PASSWORD: coherence
          POSTGRES_DB: coherence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://coherence:coherence@localhost:5432/coherence_test
          REDIS_URL: redis://localhost:6379
        run: pytest -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: backend/coverage.xml
          flags: backend

  # ── CLI ────────────────────────────────────────────────────────────────────
  cli-test:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: pip install pytest

      - name: Run CLI tests
        working-directory: cli
        run: pytest -v

  # ── Security Scan ─────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-test, cli-test]

    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

  # ── Docker Build ──────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [backend-test, cli-test, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to Staging ─────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.coherence.dev

    steps:
      - uses: actions/checkout@v4

      # These deploy steps are no-ops until STAGING_KUBECONFIG is configured
      # as a repository secret, so the job succeeds instead of failing on a
      # cluster that doesn't exist yet.
      - name: Set up kubectl
        if: ${{ secrets.STAGING_KUBECONFIG != '' }}
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure kubeconfig
        if: ${{ secrets.STAGING_KUBECONFIG != '' }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Kubernetes (staging)
        if: ${{ secrets.STAGING_KUBECONFIG != '' }}
        run: |
          kubectl set image deployment/coherence-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.sha }} \
            -n coherence-staging
          kubectl rollout status deployment/coherence-backend -n coherence-staging --timeout=120s

      - name: Skip notice
        if: ${{ secrets.STAGING_KUBECONFIG == '' }}
        run: echo "STAGING_KUBECONFIG is not configured; skipping deploy."

  # ── Deploy to Production ──────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://coherence.dev

    steps:
      - uses: actions/checkout@v4

      # These deploy steps are no-ops until PRODUCTION_KUBECONFIG is
      # configured as a repository secret, so the job succeeds instead of
      # failing on a cluster that doesn't exist yet.
      - name: Set up kubectl
        if: ${{ secrets.PRODUCTION_KUBECONFIG != '' }}
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: ${{ secrets.PRODUCTION_KUBECONFIG != '' }}
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to Kubernetes (production)
        if: ${{ secrets.PRODUCTION_KUBECONFIG != '' }}
        run: |
          kubectl set image deployment/coherence-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:sha-${{ github.sha }} \
            -n coherence
          kubectl rollout status deployment/coherence-backend -n coherence --timeout=180s

      - name: Notify Slack on deploy
        if: ${{ secrets.PRODUCTION_KUBECONFIG != '' && secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "Coherence v${{ github.sha }} deployed to production",
              "channel": "#deployments"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Skip notice
        if: ${{ secrets.PRODUCTION_KUBECONFIG == '' }}
        run: echo "PRODUCTION_KUBECONFIG is not configured; skipping deploy."
